</ul>
</li>
<li data-marpit-fragment="3">이질적인 데이터를 논리적 단위로 취급하여 코드 가독성과 유지보수성 향상</li>
</ul>
<p><img src="image-1.png" alt="center" /></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> point {
    <span class="hljs-type">int</span> x;
    <span class="hljs-type">int</span> y;
};
</code></pre>
<h3 id="struct"><code>struct</code></h3>
<ul>
<li data-marpit-fragment="4">구조체 선언을 위한 키워드</li>
</ul>
<h3 id="%ED%83%9C%EA%B7%B8-struct-tag">태그 (Struct Tag)</h3>
<ul>
<li data-marpit-fragment="5">생략 가능</li>
<li data-marpit-fragment="6"><code>point</code>는 구조체 태그이며, 생략 가능</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-marpit-fragments="1" lang="en-US">
<h2 id="basics-of-structures-contd---1">Basics of Structures (Cont'd - 1)</h2>
<h3 id="%EA%B5%AC%EC%A1%B0%EC%B2%B4-%EC%84%A0%EC%96%B8%EC%9D%84-%ED%86%B5%ED%95%B4-%EC%A0%95%EC%9D%98%ED%95%9C-%EA%B5%AC%EC%A1%B0%EC%B2%B4-%ED%98%95-%EB%B3%80%EC%88%98-%EC%84%A0%EC%96%B8">구조체 선언을 통해 정의한 구조체 형 변수 선언</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> point { <span class="hljs-comment">/* Declare a reusable structure type named point */</span>
    <span class="hljs-type">int</span> x;
    <span class="hljs-type">int</span> y;
};

<span class="hljs-type">struct</span> point p1;      <span class="hljs-comment">/* OK anywhere after the definition */</span>
<span class="hljs-type">struct</span> point p2 = p1; <span class="hljs-comment">/* OK as well */</span>
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> { <span class="hljs-comment">/* Declare an anonymous (not reuseable) structure tpye */</span>
    <span class="hljs-type">int</span> x;
    <span class="hljs-type">int</span> y;
} p2;  <span class="hljs-comment">/* Not reusable: the type has no name */</span>
</code></pre>
<h3 id="%EC%9D%B5%EB%AA%85-%EA%B5%AC%EC%A1%B0%EC%B2%B4-%EC%84%A0%EC%96%B8%EC%9D%98-%EB%8F%99%EC%9E%91-%EB%B0%A9%EC%8B%9D">익명 구조체 선언의 동작 방식</h3>
<ul>
<li data-marpit-fragment="1">각 익명 구조체 선언은 <strong>고유한</strong> 구조체 형으로 간주함</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> { <span class="hljs-type">int</span> x; <span class="hljs-type">int</span> y; } p1;  <span class="hljs-comment">/* Type A: anonymous struct 1 */</span>
<span class="hljs-type">struct</span> { <span class="hljs-type">int</span> x; <span class="hljs-type">int</span> y; } p2;  <span class="hljs-comment">/* Type B: anonymous struct 2 (new type!) */</span>
p1 = p2; <span class="hljs-comment">/* error: `p1` and `p2` have different types, assignment not allowed */</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-marpit-fragments="5" lang="en-US">
<h2 id="basics-of-structures-contd---2">Basics of Structures (Cont'd - 2)</h2>
<h3 id="%EB%A9%A4%EB%B2%84-members">멤버 (Members)</h3>
<ul>
<li data-marpit-fragment="1">구조체 내 변수들을 의미하며, <strong>멤버 또는 태그는 일반 변수와 같은 이름을 사용할 수 있음</strong>
<ul>
<li data-marpit-fragment="2">문맥 (context)에 의해 구분됨</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> id;      <span class="hljs-comment">/* `id` here is a variable in the ordinary identifier namespace */</span>
<span class="hljs-type">struct</span> id {  <span class="hljs-comment">/* `id` here is a tag in the tag namespace */</span>
    <span class="hljs-type">int</span> id;  <span class="hljs-comment">/* `id` here is a member in the structure member namespace */</span>
};
</code></pre>
<h3 id="%EA%B5%AC%EC%A1%B0%EC%B2%B4-%ED%98%95-%EB%B3%80%EC%88%98-%EC%B4%88%EA%B8%B0%ED%99%94">구조체 형 변수 초기화</h3>
<ul>
<li data-marpit-fragment="3">배열과 유사한 형태로 초기화 수행</li>
<li data-marpit-fragment="4">중괄호 안에 초기화자 목록 (list of initializers)을 쉼표로 구분하여 열거</li>
<li data-marpit-fragment="5">각 초기화자 (initializer)는 <strong>순서대로</strong> 구조체 멤버의 초기화자로 사용</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">/* The member `x` is initialized to 320. */</span>
<span class="hljs-comment">/* The member `y` is initialized to 200. */</span>
<span class="hljs-type">struct</span> point maxpt = { <span class="hljs-number">320</span>, <span class="hljs-number">200</span> };
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-marpit-fragments="1" lang="en-US">
<h2 id="basics-of-structures-contd---3">Basics of Structures (Cont'd - 3)</h2>
<h3 id="%EA%B5%AC%EC%A1%B0%EC%B2%B4-%EB%A9%A4%EB%B2%84-%EC%97%B0%EC%82%B0%EC%9E%90-structure-member-operator">구조체 멤버 연산자 (Structure Member Operator) <code>.</code></h3>
<ul>
<li data-marpit-fragment="1">구조체 형 변수의 멤버는 <code>.</code> (dot) 연산자를 사용해 접근 가능</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;(%d, %d)&quot;</span>, maxpt.x, matpt.y);  <span class="hljs-comment">/* structure-name.member */</span>
</code></pre>
<h3 id="%EC%A4%91%EC%B2%A9%EB%90%9C-%EA%B5%AC%EC%A1%B0%EC%B2%B4-%ED%91%9C%ED%98%84">중첩된 구조체 표현</h3>
<p><img src="image-3.png" alt="center" /></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> rect {
    <span class="hljs-type">struct</span> point pt1;
    <span class="hljs-type">struct</span> point pt2;
};

<span class="hljs-type">struct</span> rect screen;

screen.pt1.x;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-fragments="2" lang="en-US">
<h2 id="structures-and-functions">Structures and Functions</h2>
<ul>
<li data-marpit-fragment="1">구조체에서 허용된 연산은 같은 형 구조체 간 대입 또는 복사, 주소 얻기, 멤버 접근
<ul>
<li data-marpit-fragment="2"><strong>그 외 연산은 허용하지 않음</strong></li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">struct</span> point {
    <span class="hljs-type">int</span> x;
    <span class="hljs-type">int</span> y;
};

<span class="hljs-type">void</span> <span class="hljs-title function_">print</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> point pt)</span> <span class="hljs-comment">/* function argument: passing structure by value */</span>
{
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;Point: (%d, %d)\n&quot;</span>, pt.x, pt.y); <span class="hljs-comment">/* member access: via . operator */</span>
}

<span class="hljs-keyword">struct</span> point <span class="hljs-title function_">origin</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span> <span class="hljs-comment">/* function return: returning a structure by value */</span>
{
    <span class="hljs-comment">/* initialization: using a list of initializers */</span>
    <span class="hljs-type">struct</span> point zero = { <span class="hljs-number">0</span>, <span class="hljs-number">0</span> };
    <span class="hljs-keyword">return</span> zero;
}

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>
{
    <span class="hljs-type">struct</span> point p1 = <span class="hljs-built_in">origin</span>(); <span class="hljs-comment">/* initialization: from function return value */</span>
    <span class="hljs-type">struct</span> point p2 = p1; <span class="hljs-comment">/* initialization: by copying another structure */</span>
    <span class="hljs-type">struct</span> point *pp;     <span class="hljs-comment">/* declaration: pointer to `struct point` */</span>

    p1 = p2;        <span class="hljs-comment">/* assignment: entire structure assignment */</span>
    <span class="hljs-built_in">print</span>(p1);      <span class="hljs-comment">/* function argument: passing structure by value */</span>
    pp = &amp;p2;       <span class="hljs-comment">/* address-of: take address of structure */</span>
    pp-&gt;x += pp-&gt;y; <span class="hljs-comment">/* member access: via -&gt; operator */</span>
    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-marpit-fragments="7" lang="en-US">
<h2 id="structures-and-functions-contd---1">Structures and Functions (Cont'd - 1)</h2>
<ul>
<li data-marpit-fragment="1">구조체에 허용된 연산은 일부이며, 그 외 필요한 연산은 직접 함수로 구현해 사용해야 함</li>
<li data-marpit-fragment="2"><code>struct point</code> 형을 조작할 수 있는 함수를 소개하면서 구조체를 사용하는 함수의 유형 소개</li>
</ul>
<h3 id="%EA%B5%AC%EC%A1%B0%EC%B2%B4%EC%9D%98-%EA%B0%81-%EB%A9%A4%EB%B2%84%EB%A5%BC-%EA%B0%9C%EB%B3%84-%EC%9D%B8%EC%9E%90%EB%A1%9C-%ED%95%A8%EC%88%98%EC%97%90-%EC%A0%84%EB%8B%AC-pass-components-separately">구조체의 각 멤버를 개별 인자로 함수에 전달 (Pass Components Separately)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">/* makepoint: make a point from x and y components */</span>
<span class="hljs-keyword">struct</span> point <span class="hljs-title function_">makepoint</span><span class="hljs-params">(<span class="hljs-type">int</span> x, <span class="hljs-type">int</span> y)</span>
{
    <span class="hljs-type">struct</span> point temp;

    <span class="hljs-comment">/* reusing &#x27;x&#x27; and &#x27;y&#x27; as both parameter and member names emphasizes the
     * mapping */</span>
    temp.x = x;
    temp.y = y;

    <span class="hljs-keyword">return</span> temp;
}
</code></pre>
<ul>
<li data-marpit-fragment="3">일반 변수 (매개변수)의 이름과 멤버의 이름이 문맥에 의해 구분됨</li>
<li data-marpit-fragment="4">이를 기반으로 매개변수가 어느 멤버와 연관되는지를 강조할 수 있음</li>
<li data-marpit-fragment="5">멤버의 수가 많아진다면 매개변수가 늘어남에 따라 가독성이 저하될 수 있음
<ul>
<li data-marpit-fragment="6">함수의 매개변수 수는 최대 5개를 넘지 않는 것이 관례</li>
<li data-marpit-fragment="7">만약 매개변수 수가 5개를 넘어갈 경우 함수를 재작성해야 함</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-marpit-fragments="2" lang="en-US">
<h2 id="structures-and-functions-contd---2">Structures and Functions (Cont'd - 2)</h2>
<h3 id="%EA%B5%AC%EC%A1%B0%EC%B2%B4-%EC%A0%84%EC%B2%B4%EB%A5%BC-%ED%95%A8%EC%88%98%EC%97%90-%EC%A0%84%EB%8B%AC-pass-an-entire-structure">구조체 전체를 함수에 전달 (Pass an Entire Structure)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">/* addpoints: add two points */</span>
<span class="hljs-keyword">struct</span> point <span class="hljs-title function_">addpoint</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> point p1, <span class="hljs-keyword">struct</span> point p2)</span>
{
    p1.x += p2.x;
    p1.y += p2.y;

    <span class="hljs-keyword">return</span> p1;
}
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">/* ptinrect: return 1 if p in r, 0 if not */</span>
<span class="hljs-type">int</span> <span class="hljs-title function_">ptinrect</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> point p, <span class="hljs-keyword">struct</span> rect r)</span>
{
    <span class="hljs-keyword">return</span> p.x &gt;= r.pt1.x &amp;&amp; p.x &lt; r.pt2.x &amp;&amp; p.y &gt;= r.pt1.y &amp;&amp; p.y &lt; r.pt2.y;
}
</code></pre>
<ul>
<li data-marpit-fragment="1">구조체 전체를 함수에 값 형태로 전달</li>
<li data-marpit-fragment="2">멤버를 포함한 구조체 자체를 함수로 전달함에 따라 매개변수 수를 줄일 수 있음</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-marpit-fragments="1" lang="en-US">
<h2 id="structures-and-functions-contd---3">Structures and Functions (Cont'd - 3)</h2>
<h3 id="%EA%B5%AC%EC%A1%B0%EC%B2%B4-%EC%A0%84%EC%B2%B4%EB%A5%BC-%ED%95%A8%EC%88%98%EC%97%90-%EC%A0%84%EB%8B%AC-%EC%8B%9C-%EC%9C%A0%EC%9D%98%EC%82%AC%ED%95%AD">구조체 전체를 함수에 전달 시 유의사항</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">/* addpoints: add two points */</span>
<span class="hljs-keyword">struct</span> point <span class="hljs-title function_">addpoint</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> point p1, <span class="hljs-keyword">struct</span> point p2)</span>
{
    p1.x += p2.x;
    p1.y += p2.y;

    <span class="hljs-keyword">return</span> p1;
}
</code></pre>
<ul>
<li data-marpit-fragment="1">크기가 큰 구조체를 값으로 전달하는 것보다는 <strong>구조체의 포인터를 전달</strong>하는 것이 성능 관점에서 유리함</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">struct</span> iarray {
    <span class="hljs-type">int</span> arr[<span class="hljs-number">256</span>];
};

<span class="hljs-type">void</span> <span class="hljs-title function_">value</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> iarray arr)</span>
{
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;[value] size: %ld\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(arr)); <span class="hljs-comment">/* [value] size: 1024 */</span>
}

<span class="hljs-type">void</span> <span class="hljs-title function_">ptr</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> iarray *parr)</span>
{
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;[ptr] size: %ld\n&quot;</span>, <span class="hljs-keyword">sizeof</span>(parr)); <span class="hljs-comment">/* [ptr] size: 8 (or 4) */</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-marpit-fragments="4" lang="en-US">
<h2 id="structures-and-functions-contd---4">Structures and Functions (Cont'd - 4)</h2>
<h3 id="%EA%B5%AC%EC%A1%B0%EC%B2%B4%EC%9D%98-%ED%8F%AC%EC%9D%B8%ED%84%B0%EB%A5%BC-%ED%95%A8%EC%88%98%EC%97%90-%EC%A0%84%EB%8B%AC-pass-a-pointer">구조체의 포인터를 함수에 전달 (Pass a Pointer)</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">/* printpoint: print a point */</span>
<span class="hljs-type">void</span> <span class="hljs-title function_">printpoint</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> point *pt)</span>
{
    <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;(%d, %d)\n&quot;</span>, (*pt).x, pt-&gt;y);
}
</code></pre>
<h3 id="%EA%B5%AC%EC%A1%B0%EC%B2%B4-%EB%A9%A4%EB%B2%84-%EC%97%B0%EC%82%B0%EC%9E%90-structure-member-operator-1">구조체 멤버 연산자 (Structure Member Operator) <code>-&gt;</code></h3>
<ul>
<li data-marpit-fragment="1">구조체 형 포인터가 가리키는 대상의 멤버는 <code>-&gt;</code> (arrow) 연산자를 사용해 접근 가능</li>
</ul>
<h4 id="ptx"><code>(*pt).x</code></h4>
<ul>
<li data-marpit-fragment="2">최상위 우선순위를 갖는 연산자는 네 가지: <code>()</code>, <code>[]</code>, <code>.</code>, <code>-&gt;</code></li>
<li data-marpit-fragment="3">괄호를 사용하지 않으면 <code>*(pt.x)</code>로 평가되며, 멤버 <code>x</code>는 포인터가 아니므로 문법적으로 틀린 표현이 됨</li>
</ul>
<h4 id="pt-y"><code>pt-&gt;y</code></h4>
<ul>
<li data-marpit-fragment="4"><code>pt</code>가 구조체를 가리키는 포인터라면, <code>-&gt;</code> 연산자를 사용해 역참조된 객체의 특정 멤버를 가리킬 수 있음</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" lang="en-US">
<h2 id="structures-and-functions-contd---5">Structures and Functions (Cont'd - 5)</h2>
<h3 id="exercise-%E2%80%93-operator-precedence-with-struct-pointers">Exercise – Operator Precedence with Struct Pointers</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-type">struct</span> data {
    <span class="hljs-type">int</span> id;
    <span class="hljs-type">char</span> *str;
};

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>
{
    <span class="hljs-type">char</span> buf1[] = <span class="hljs-string">&quot;abc&quot;</span>;
    <span class="hljs-type">char</span> buf2[] = <span class="hljs-string">&quot;def&quot;</span>;
    <span class="hljs-type">char</span> buf3[] = <span class="hljs-string">&quot;xyz&quot;</span>;

    <span class="hljs-type">struct</span> data *p = arr;

    ++p-&gt;id;     <span class="hljs-comment">/* increments `id`, not p -&gt; implied: ++(p-&gt;id) */</span>

<h2 id="arrays-of-structures">Arrays of Structures</h2>
<h3 id="c-%EC%96%B8%EC%96%B4-%EC%98%88%EC%95%BD%EC%96%B4-keywords-%EC%9E%85%EB%A0%A5-%EB%B9%88%EB%8F%84%EB%A5%BC-%EA%B3%84%EC%82%B0%ED%95%98%EB%8A%94-%ED%94%84%EB%A1%9C%EA%B7%B8%EB%9E%A8">C 언어 예약어 (keywords) 입력 빈도를 계산하는 프로그램</h3>
<ul>
<li data-marpit-fragment="1">예약어들을 보관할 배열과 각 예약어의 입력 빈도를 보관할 변수 하나가 필요함</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> *keyword[NKEYS];
<span class="hljs-type">int</span> keycount[NKEYS];
</code></pre>
<ul>
<li data-marpit-fragment="2">각 배열은 인덱스를 기준으로 관련된 데이터를 나란히 저장하고 있음 (평행 구조, parallel arrays)</li>
<li data-marpit-fragment="3"><strong>평행 구조 데이터는 서로 분리되어 있음</strong>
<ul>
<li data-marpit-fragment="4">데이터를 조작할 경우 평행 구조에 놓여 있는 모든 데이터에 대해서 각각 작업이 이루어져야 함</li>
<li data-marpit-fragment="5">평행 구조 데이터를 함수 내에서 조작해야 할 경우, 평행 구조에 놓여 있는 모든 데이터를 인자로써 넘겨야 함</li>
</ul>
</li>
<li data-marpit-fragment="6">평행 구조를 이루는 데이터는 구조체 배열을 사용해 <strong>논리적으로 결합된 하나위 단위</strong>로써 데이터를 조작할 수 있음</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> key {
    <span class="hljs-type">char</span> *word;
    <span class="hljs-type">int</span> count;
} keytab[NKEYS];
</code></pre>
<ul>
<li data-marpit-fragment="7">구조체 배열의 각 요소는 다음과 같은 데이터 쌍을 이룸</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> *word;
<span class="hljs-type">int</span> count;
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-marpit-fragments="4" lang="en-US">
<h2 id="arrays-of-structures-contd---1">Arrays of Structures (Cont'd - 1)</h2>
<h3 id="%EA%B5%AC%EC%A1%B0%EC%B2%B4-%EB%B0%B0%EC%97%B4-%EC%B4%88%EA%B8%B0%ED%99%94">구조체 배열 초기화</h3>
<ul>
<li data-marpit-fragment="1">구조체 배열 초기화는 배열 초기화처럼 중괄호로 둘러쌓인 초기화자 목록 사용
<ul>
<li data-marpit-fragment="2">중괄호 내 초기화자들은 순서대로 각 요소 별 멤버의 초기화자로 사용</li>
<li data-marpit-fragment="3"><code>keytab[0].word</code>는 <code>&quot;auto&quot;</code>의 시작 주소, <code>keytab[0].count</code>는 <code>0</code>으로 초기화</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> key keytab[] = {
    <span class="hljs-string">&quot;auto&quot;</span>, <span class="hljs-number">0</span>, <span class="hljs-string">&quot;break&quot;</span>, <span class="hljs-number">0</span>, <span class="hljs-string">&quot;case&quot;</span>, <span class="hljs-number">0</span>, <span class="hljs-string">&quot;char&quot;</span>, <span class="hljs-number">0</span>,
    <span class="hljs-comment">/* ... skipped ... */</span>
    <span class="hljs-string">&quot;unsigned&quot;</span>, <span class="hljs-number">0</span>, <span class="hljs-string">&quot;void&quot;</span>, <span class="hljs-number">0</span>, <span class="hljs-string">&quot;volatile&quot;</span>, <span class="hljs-number">0</span>, <span class="hljs-string">&quot;while&quot;</span>, <span class="hljs-number">0</span>
};
</code></pre>
<ul>
<li data-marpit-fragment="4">아래와 같이 중괄호를 추가로 사용하면 가독성을 높임과 동시에 실수를 방지할 수 있음</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> key keytab[] = {
    { <span class="hljs-string">&quot;auto&quot;</span>, <span class="hljs-number">0</span> },     { <span class="hljs-string">&quot;break&quot;</span>, <span class="hljs-number">0</span> },    { <span class="hljs-string">&quot;case&quot;</span>, <span class="hljs-number">0</span> },     { <span class="hljs-string">&quot;char&quot;</span>, <span class="hljs-number">0</span> },

    { <span class="hljs-string">&quot;double&quot;</span>, <span class="hljs-number">0</span> },   { <span class="hljs-string">&quot;else&quot;</span>, <span class="hljs-number">0</span> },     { <span class="hljs-string">&quot;enum&quot;</span>, <span class="hljs-number">0</span> },     { <span class="hljs-string">&quot;extern&quot;</span>, <span class="hljs-number">0</span> },
    { <span class="hljs-string">&quot;float&quot;</span>, <span class="hljs-number">0</span> },    { <span class="hljs-string">&quot;for&quot;</span>, <span class="hljs-number">0</span> },      { <span class="hljs-string">&quot;goto&quot;</span>, <span class="hljs-number">0</span> },     { <span class="hljs-string">&quot;if&quot;</span>, <span class="hljs-number">0</span> },
    { <span class="hljs-string">&quot;int&quot;</span>, <span class="hljs-number">0</span> },      { <span class="hljs-string">&quot;long&quot;</span>, <span class="hljs-number">0</span> },     { <span class="hljs-string">&quot;register&quot;</span>, <span class="hljs-number">0</span> }, { <span class="hljs-string">&quot;return&quot;</span>, <span class="hljs-number">0</span> },

    { <span class="hljs-string">&quot;struct&quot;</span>, <span class="hljs-number">0</span> },   { <span class="hljs-string">&quot;switch&quot;</span>, <span class="hljs-number">0</span> },   { <span class="hljs-string">&quot;typedef&quot;</span>, <span class="hljs-number">0</span> },  { <span class="hljs-string">&quot;union&quot;</span>, <span class="hljs-number">0</span> },
    { <span class="hljs-string">&quot;unsigned&quot;</span>, <span class="hljs-number">0</span> }, { <span class="hljs-string">&quot;void&quot;</span>, <span class="hljs-number">0</span> },     { <span class="hljs-string">&quot;volatile&quot;</span>, <span class="hljs-number">0</span> }, { <span class="hljs-string">&quot;while&quot;</span>, <span class="hljs-number">0</span> }

</section>

<h2 id="arrays-of-structures-contd---2">Arrays of Structures (Cont'd - 2)</h2>
<h3 id="sizeof"><code>sizeof</code></h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">sizeof object
sizeof(type name)
</code></pre>
<ul>
<li data-marpit-fragment="1"><code>object</code> 또는 <code>type</code>의 바이트 수를 정수형으로 평가하는 단항 연산자</li>
<li data-marpit-fragment="2"><strong>컴파일 시 연산이 이루어지는 연산자</strong></li>
</ul>
<h4 id="sizeof-%EC%97%B0%EC%82%B0%EC%9E%90%EC%9D%98-%EC%82%AC%EC%9A%A9-%EC%98%88---%EB%B0%B0%EC%97%B4-%ED%81%AC%EA%B8%B0-%EC%9E%90%EB%8F%99-%EA%B3%84%EC%82%B0"><code>sizeof</code> 연산자의 사용 예 - 배열 크기 자동 계산</h4>
<ul>
<li data-marpit-fragment="3">요소 수가 많은 배열의 크기는 직접 계산하는 것 보다는 <strong>기계가 자동으로 계산한 값을 쓰는 것</strong>이 쉽고 안전한 방법</li>
<li data-marpit-fragment="4">아래와 같은 방법으로 배열 크기를 자동으로 관리할 수 있음
<ul>
<li data-marpit-fragment="5">코드 내 배열 요소 수가 변경되더라도 컴파일러가 올바른 크기를 자동으로 계산함</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">/* 1 */</span> <span class="hljs-meta">#<span class="hljs-keyword">define</span> NKEYS (sizeof keytab / sizeof(struct key))</span>
<span class="hljs-comment">/* 2 */</span> <span class="hljs-meta">#<span class="hljs-keyword">define</span> NKEYS (sizeof keytab / sizeof(keytab[0]))</span>
</code></pre>
<ul>
<li data-marpit-fragment="6">두 번째 방법은 구조체 형이 바뀌어도 수정하지 않아도 된다는 장점이 있음</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-marpit-fragments="1" lang="en-US">

<li data-marpit-fragment="1"><code>main.c</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;ctype.h&gt;</span></span>

<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&quot;key.h&quot;</span></span>

<span class="hljs-meta">#<span class="hljs-keyword">define</span> MAXWORD 100</span>

<span class="hljs-keyword">struct</span> key *<span class="hljs-title function_">binsearch</span><span class="hljs-params">(<span class="hljs-type">char</span> *, <span class="hljs-keyword">struct</span> key[], <span class="hljs-type">int</span>)</span>;
<span class="hljs-type">int</span> <span class="hljs-title function_">getword</span><span class="hljs-params">(<span class="hljs-type">char</span> *, <span class="hljs-type">int</span>)</span>;

<span class="hljs-comment">/* count C keywords; pointer version */</span>
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>
{
    <span class="hljs-type">struct</span> key *p;
    <span class="hljs-type">char</span> word[MAXWORD];

    <span class="hljs-keyword">while</span> (<span class="hljs-built_in">getword</span>(word, MAXWORD) != EOF) {
        <span class="hljs-keyword">if</span> (<span class="hljs-built_in">isalpha</span>(word[<span class="hljs-number">0</span>])) {
            <span class="hljs-keyword">if</span> ((p = <span class="hljs-built_in">binsearch</span>(word, keytab, NKEYS)) != <span class="hljs-literal">NULL</span>)
                p-&gt;count++;
        }
    }
    <span class="hljs-keyword">for</span> (p = keytab; p &lt; keytab + NKEYS; p++) {
        <span class="hljs-keyword">if</span> (p-&gt;count &gt; <span class="hljs-number">0</span>)
            <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%4d %s\n&quot;</span>, p-&gt;count, p-&gt;word);
    }

    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}

<h2 id="arrays-of-structures-contd---6">Arrays of Structures (Cont'd - 6)</h2>
<ul>
<li data-marpit-fragment="1"><code>bsearch.c</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;string.h&gt;</span></span>

<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&quot;key.h&quot;</span></span>

<span class="hljs-comment">/* binsearch: find word in tab[0]...tab[n-1] */</span>
<span class="hljs-keyword">struct</span> key *<span class="hljs-title function_">binsearch</span><span class="hljs-params">(<span class="hljs-type">char</span> *word, <span class="hljs-keyword">struct</span> key tab[], <span class="hljs-type">int</span> n)</span>
{
    <span class="hljs-type">int</span> cond;
    <span class="hljs-type">struct</span> key *low = &amp;tab[<span class="hljs-number">0</span>];
    <span class="hljs-type">struct</span> key *high = &amp;tab[n];
    <span class="hljs-type">struct</span> key *mid;

    <span class="hljs-keyword">while</span> (low &lt; high) {
        mid = low + (high - low) / <span class="hljs-number">2</span>;
        <span class="hljs-keyword">if</span> ((cond = <span class="hljs-built_in">strcmp</span>(word, mid-&gt;word)) &lt; <span class="hljs-number">0</span>)
            high = mid;
        <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (cond &gt; <span class="hljs-number">0</span>)
            low = mid + <span class="hljs-number">1</span>;
        <span class="hljs-keyword">else</span>
            <span class="hljs-keyword">return</span> mid;
    }

    <span class="hljs-keyword">return</span> <span class="hljs-literal">NULL</span>;
}
</code></pre>
</section>

</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;ctype.h&gt;</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-comment">/* getword: get next word or character from input */</span>
<span class="hljs-type">int</span> <span class="hljs-title function_">getword</span><span class="hljs-params">(<span class="hljs-type">char</span> *word, <span class="hljs-type">int</span> lim)</span>
{
    <span class="hljs-type">int</span> c, <span class="hljs-built_in">getch</span>(<span class="hljs-type">void</span>);
    <span class="hljs-type">void</span> <span class="hljs-title function_">ungetch</span><span class="hljs-params">(<span class="hljs-type">int</span>)</span>;
    <span class="hljs-type">char</span> *w;

    w = word;
    <span class="hljs-keyword">while</span> (<span class="hljs-built_in">isspace</span>(c = <span class="hljs-built_in">getch</span>())) {}
    <span class="hljs-keyword">if</span> (c != EOF)
        *w++ = c;
    <span class="hljs-keyword">if</span> (!<span class="hljs-built_in">isalpha</span>(c)) {
        *w = <span class="hljs-string">&#x27;\0&#x27;</span>;

        <span class="hljs-keyword">return</span> c;
    }
    <span class="hljs-keyword">for</span> (; --lim &gt; <span class="hljs-number">0</span>; w++) {
        <span class="hljs-keyword">if</span> (!<span class="hljs-built_in">isalnum</span>(*w = <span class="hljs-built_in">getch</span>())) {
            <span class="hljs-built_in">ungetch</span>(*w);
            <span class="hljs-keyword">break</span>;
        }
    }
    *w = <span class="hljs-string">&#x27;\0&#x27;</span>;

    <span class="hljs-keyword">return</span> word[<span class="hljs-number">0</span>];
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-marpit-fragments="3" lang="en-US">
<h2 id="arrays-of-structures-contd---8">Arrays of Structures (Cont'd - 8)</h2>
<h3 id="%EB%A9%94%EB%AA%A8%EB%A6%AC-%EC%A0%95%EB%A0%AC-%EA%B7%9C%EC%B9%99-memory-alignment">메모리 정렬 규칙 (Memory Alignment)</h3>
<ul>
<li data-marpit-fragment="1">구조체 멤버 중 가장 큰 자료형의 크기를 기준으로 메모리를 정렬함</li>
<li data-marpit-fragment="2"><strong>모든 멤버의 주소는 자신의 자료형 크기로 나누어질 수 있는 주소를 가져야 함</strong>
<ul>
<li data-marpit-fragment="3">만약 올바른 주소를 가질 수 없다면, 유효한 주소를 가질 수 있을 때까지 셀을 건너뜀 (padding)</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> {
    <span class="hljs-type">char</span> c1;
    <span class="hljs-type">char</span> c2;
    <span class="hljs-type">char</span> c3;
} ccc;
</code></pre>
<p><img src="image-4.png" alt="center" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-marpit-fragments="1" lang="en-US">
<h2 id="arrays-of-structures-contd---9">Arrays of Structures (Cont'd - 9)</h2>
<h3 id="%EB%A9%94%EB%AA%A8%EB%A6%AC-%EC%A0%95%EB%A0%AC-%EA%B7%9C%EC%B9%99%EC%9D%84-%ED%99%9C%EC%9A%A9%ED%95%9C-%EC%98%88---%EB%A9%94%EB%AA%A8%EB%A6%AC-%EC%A0%88%EC%95%BD">메모리 정렬 규칙을 활용한 예 - 메모리 절약</h3>
<ul>
<li data-marpit-fragment="1">아래 두 구조체는 같은 종류의 멤버를 구성하나, 순서에 따라 메모리 사용량에 차이가 발생할 수 있음</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> {
    <span class="hljs-type">short</span> s;
    <span class="hljs-type">int</span> i;
    <span class="hljs-type">char</span> c;
} sic;
</code></pre>
<p><img src="image-5.png" alt="center" /></p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> {
    <span class="hljs-type">short</span> s;
    <span class="hljs-type">char</span> c;
    <span class="hljs-type">int</span> i;
} sci;
</code></pre>
<p><img src="image-6.png" alt="center" /></p>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-marpit-fragments="3" lang="en-US">
<h2 id="arrays-of-structures-contd---10">Arrays of Structures (Cont'd - 10)</h2>
<h3 id="%EA%B5%AC%EC%A1%B0%EC%B2%B4-%EB%B0%98%ED%99%98%ED%98%95">구조체 반환형</h3>
<ul>
<li data-marpit-fragment="1">복합형 (a complicated type, e.g., a structure pointer)을 반환하는 함수는 가독성이 좋지 못함
<ul>
<li data-marpit-fragment="2">복합형은 여러 단어를 포함할 수 있으며, 이는 함수의 이름을 빠르게 판단하기 어려울 수 있음</li>
</ul>
</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-keyword">struct</span> key *<span class="hljs-title function_">binsearch</span><span class="hljs-params">(<span class="hljs-type">char</span> *word, <span class="hljs-keyword">struct</span> key tab[], <span class="hljs-type">int</span> n)</span>;
</code></pre>
<ul>
<li data-marpit-fragment="3">다음과 같은 형태를 사용하면 반환형과 이름을 확실히 구분할 수 있음</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">/* This is a matter of personal taste; pick the form you like and HOLD to it. */</span>
<span class="hljs-keyword">struct</span> key *
<span class="hljs-title function_">binsearch</span><span class="hljs-params">(<span class="hljs-type">char</span> *word, <span class="hljs-keyword">struct</span> key tab[], <span class="hljs-type">int</span> n)</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-marpit-fragments="11" lang="en-US">
<h2 id="self%E2%80%91referential-structures">Self‑referential Structures</h2>
<h3 id="%EC%9E%85%EB%A0%A5%EB%90%98%EB%8A%94-%EB%8B%A8%EC%96%B4%EC%9D%98-%EB%B9%88%EB%8F%84-%EC%88%98%EB%A5%BC-%EA%B3%84%EC%82%B0%ED%95%98%EB%8A%94-%ED%94%84%EB%A1%9C%EA%B7%B8%EB%9E%A8">입력되는 단어의 빈도 수를 계산하는 프로그램</h3>
<ul>
<li data-marpit-fragment="1">C 언어 예약어 입력 빈도 계산 프로그램은 <strong>입력될 데이터가 이미 알려진 경우</strong>였음
<ul>
<li data-marpit-fragment="2">키워드를 빠르게 탐색할 수 있도록 구조체 배열에 키워드 정보를 <strong>오름차순</strong>으로 초기화</li>
</ul>
</li>
<li data-marpit-fragment="3">일반적으로 프로그램에 입력될 데이터를 사전에 모르는 경우가 대부분임
<ul>
<li data-marpit-fragment="4">입력될 데이터를 알지 못하므로 미리 정렬하거나 이진 탐색을 적용할 수 없는 상황</li>
</ul>
</li>
<li data-marpit-fragment="5">선형 탐색 (linear search)을 사용해 단어가 입력될 때마다 매번 탐색하는 것은 매우 비효울적임
<ul>
<li data-marpit-fragment="6">입력 단어 수가 많아질수록 실행 시간이 제곱에 비례 (quadratic)함</li>
</ul>
</li>
</ul>
<h4 id="%ED%95%B4%EA%B2%B0-%EB%B0%A9%EC%95%88">해결 방안</h4>
<ul>
<li data-marpit-fragment="7">단어가 입력될 때마다 정렬된 상태로 유지한 후, 이진 탐색 사용</li>
<li data-marpit-fragment="8">일반 배열을 사용할 경우, 정렬을 위한 요소 간 이동이 발생함에 따라 성능 저하가 있음</li>
<li data-marpit-fragment="9"><strong>이진 트리</strong> (binary tree) 자료 구조를 사용하면 입력된 데이터를 효율적으로 정렬할 수 있음</li>
</ul>
<h3 id="%EB%85%B8%EB%93%9C-nodes">노드 (Nodes)</h3>
<ul>
<li data-marpit-fragment="10">트리는 각 단어 당 하나의 노드를 사용해 관리하며, 하나의 노드는 다음 정보들을 포함함:</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">a pointer to the text of the word
a count of the number of occurrences
a pointer to the left child node
a pointer to the right child node
</code></pre>
<ul>
<li data-marpit-fragment="11"><strong>모든 노드는 최대 두 개의 자식 (children) 노드를 가질 수 있음</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-marpit-fragments="4" lang="en-US">
<h2 id="self%E2%80%91referential-structures-contd---1">Self‑referential Structures (Cont'd - 1)</h2>
<h3 id="%EC%9D%B4%EC%A7%84-%ED%8A%B8%EB%A6%AC-binary-tree">이진 트리 (Binary Tree)</h3>
<ul>
<li data-marpit-fragment="1">이진 트리 자료 구조가 노드들을 관리하면 다음과 같은 특징이 있음:
<ol>
<li>왼쪽 부분 트리 (subtree)에 속한 노드들의 단어는 현재 노드의 단어보다 사전 순으로 앞에 위치한다.</li>
<li>오른쪽 부분 트리 (subtree)에 속한 노드들의 단어는 현재 노드의 단어보다 사전 순으로 뒤에 위치한다.</li>
</ol>
</li>
<li data-marpit-fragment="2">문장 &quot;now is the time for all good men to come to the aid of their party&quot;을 트리로 표현하면 다음과 같음:</li>
</ul>
<p><img src="image-7.png" alt="center" /></p>
<h4 id="%EC%9D%B4%EC%A7%84-%ED%8A%B8%EB%A6%AC%EC%97%90%EC%84%9C-%EC%83%88-%EB%8B%A8%EC%96%B4%EC%9D%98-%EC%A1%B4%EC%9E%AC-%EC%9C%A0%EB%AC%B4-%ED%99%95%EC%9D%B8-%EB%B0%A9%EB%B2%95">이진 트리에서 새 단어의 존재 유무 확인 방법</h4>
<ul>
<li data-marpit-fragment="3">다음 과정은 재귀적으로 수행됨:
<ol>
<li>루트 노드의 단어와 새 단어를 비교한다.</li>
<li>서로 일치하면 단어가 이미 입력되어 있는 상태다.</li>
<li>서로 불일치하고 새 단어가 사전 순으로 앞에 위치하면, 왼쪽 부분 트리로 이동하여 왼쪽 자식에서 다시 비교한다.</li>
<li>서로 불일치하고 새 단어가 사전 순으로 뒤에 위치하면, 오른쪽 부분 트리로 이동하여 오른쪽 자식에서 다시 비교한다.</li>
<li>탐색을 올바른 방향대로 지속하였음에도 찾지 못하였다면, 단어는 트리 내에 존재하지 않는 상태다
<ul>
<li data-marpit-fragment="4"><strong>현재 가리키는 빈 공간은 새 단어가 트리에 등록될 경우 노드가 새로 추가될 위치이기도 함</strong></li>
</ul>
</li>
</ol>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-marpit-fragments="7" lang="en-US">
<h2 id="self%E2%80%91referential-structures-contd---2">Self‑referential Structures (Cont'd - 2)</h2>
<h3 id="%EC%9E%90%EA%B8%B0-%EC%B0%B8%EC%A1%B0-%EA%B5%AC%EC%A1%B0%EC%B2%B4">자기 참조 구조체</h3>
<ul>
<li data-marpit-fragment="1">자기 자신을 가리키는 포인터를 멤버로 구성한 구조체</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> tnode {           <span class="hljs-comment">/* the tree node: */</span>
    <span class="hljs-type">char</span> *word;          <span class="hljs-comment">/* points to the text */</span>
    <span class="hljs-type">int</span> count;           <span class="hljs-comment">/* number of occurrences */</span>
    <span class="hljs-type">struct</span> tnode *left;  <span class="hljs-comment">/* left child */</span>
    <span class="hljs-type">struct</span> tnode *right; <span class="hljs-comment">/* right child */</span>
};
</code></pre>
<ul>
<li data-marpit-fragment="2">구조체 이름이 선언되는 순간, 컴파일러는 이를 이름만 가진 불완전 형 (incomplete type)으로 간주됨
<ul>
<li data-marpit-fragment="3">구조체 정의가 마무리되어야 완전 형 (complete type)으로 간주</li>
</ul>
</li>
<li data-marpit-fragment="4">자기 자신의 객체를 포함하는 것은 허용되지 않음
<ul>
<li data-marpit-fragment="5">불완전 형 객체는 <strong>실제 얼마큼의 메모리를 점유해야 할지 알 수 없으므로</strong> 생성 불가</li>
</ul>
</li>
<li data-marpit-fragment="6"><strong>자기 자신을 가리키는 포인터는 허용함</strong>
<ul>
<li data-marpit-fragment="7">가리키는 대상이 불완전 형이지만, 포인터는 메모리 크기 (4 or 8 bytes)가 이미 정해져 있으므로 생성 가능</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-marpit-fragments="2" lang="en-US">
<h2 id="self%E2%80%91referential-structures-contd---3">Self‑referential Structures (Cont'd - 3)</h2>
<h3 id="%EC%9E%90%EA%B8%B0-%EC%B0%B8%EC%A1%B0-%EA%B5%AC%EC%A1%B0%EC%B2%B4-%EC%9D%91%EC%9A%A9-%EA%B5%AC%EC%A1%B0%EC%B2%B4-%EC%84%A0%EC%96%B8%EC%9D%84-%EC%82%AC%EC%9A%A9%ED%95%9C-%EC%84%9C%EB%A1%9C%EB%A5%BC-%EC%B0%B8%EC%A1%B0%ED%95%98%EB%8A%94-%EA%B5%AC%EC%A1%B0%EC%B2%B4">자기 참조 구조체 응용: 구조체 선언을 사용한 서로를 참조하는 구조체</h3>
<ul>
<li data-marpit-fragment="1">구조체 선언은 해당 형이 사용될 것임을 미리 알리기 위한 용도
<ul>
<li data-marpit-fragment="2">해당 선언의 실제 정의는 다른 어딘가에 반드시 존재해야 함</li>
</ul>
</li>
</ul>
<table>
<thead>
<tr>
<th><strong>Aspect</strong></th>
<th><strong>Struct Definition</strong></th>
<th><strong>Struct Declaration</strong></th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>Purpose</strong></td>
<td>Defines a complete structure type with member layout</td>
<td>Introduces the structure type name without detailing its members</td>
</tr>
<tr>
<td><strong>Completeness</strong></td>
<td>Complete type (can instantiate variables and compute size)</td>
<td>Incomplete type (cannot instantiate or dereference its objects)</td>
</tr>
<tr>
<td><strong>Syntax</strong></td>
<td><code>struct Point { int x; int y; };</code></td>
<td><code>struct Point;</code></td>
</tr>
</tbody>
</table>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">/* Forward declaration of struct s is required before using it as a pointer
 * type. */</span>
<span class="hljs-type">struct</span> s;

<span class="hljs-type">struct</span> t {
    <span class="hljs-type">struct</span> s *p;  <span class="hljs-comment">/* `p` points to a `struct s` */</span>
};

<span class="hljs-type">struct</span> s {
    <span class="hljs-type">struct</span> t *q;  <span class="hljs-comment">/* `q` points to a `struct t` */</span>
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-marpit-fragments="5" lang="en-US">
<h2 id="self%E2%80%91referential-structures-contd---4">Self‑referential Structures (Cont'd - 4)</h2>
<h3 id="alloc-%ED%95%A8%EC%88%98%EC%9D%98-%EB%AC%B8%EC%A0%9C%EC%A0%90"><code>alloc</code> 함수의 문제점</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">define</span> ALLOCSIZE 10000          <span class="hljs-comment">/* size of available space */</span></span>
<span class="hljs-type">static</span> <span class="hljs-type">char</span> allocbuf[ALLOCSIZE]; <span class="hljs-comment">/* storage for alloc */</span>
<span class="hljs-type">static</span> <span class="hljs-type">char</span> *allocp = allocbuf;  <span class="hljs-comment">/* next free position */</span>

<span class="hljs-type">char</span> *<span class="hljs-title function_">alloc</span><span class="hljs-params">(<span class="hljs-type">int</span> n)</span>;  <span class="hljs-comment">/* return pointer to n characters */</span>
<span class="hljs-type">void</span> <span class="hljs-title function_">afree</span><span class="hljs-params">(<span class="hljs-type">char</span> *p)</span>; <span class="hljs-comment">/* free storage pointed to by p */</span>
</code></pre>
<blockquote>
<p>How does it meet the requirement of most real machines that objects of certain types must satisfy alignment restrictions (for example, integers often must be located at even addresses)?</p>
</blockquote>
<ul>
<li data-marpit-fragment="1"><code>alloc</code> 함수는 단순히 바이트 수만 인자로 전달 받아 처리함</li>
<li data-marpit-fragment="2">메모리 정렬 규칙은 누락된 상태</li>
</ul>
<blockquote>
<p>What declarations can cope with the fact that an allocator must necessarily return different kinds of pointers?</p>
</blockquote>
<ul>
<li data-marpit-fragment="3"><code>alloc</code> 함수는 반환형이 <code>char *</code>로 고정임</li>
<li data-marpit-fragment="4">자료형에 대한 고려는 되어있지 않음</li>
</ul>
<blockquote>
<p>What problems may occur when creation and destruction orders are mismatched?</p>
</blockquote>
<ul>
<li data-marpit-fragment="5">스택 기반의 저장공간 할당기는 반드시 할당 순서의 역순으로 할당받은 객체를 반환해야 함</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-marpit-fragments="11" lang="en-US">
<h2 id="self%E2%80%91referential-structures-contd---5">Self‑referential Structures (Cont'd - 5)</h2>
<h3 id="%EB%8F%99%EC%A0%81-%EC%A0%80%EC%9E%A5%EA%B3%B5%EA%B0%84-%ED%95%A0%EB%8B%B9%EA%B8%B0">동적 저장공간 할당기</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">/* `malloc` and related routines are declared in the header &lt;stdlib.h&gt; */</span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdlib.h&gt;</span> <span class="hljs-comment">/* to use malloc(), calloc(), free(), etc. */</span></span>

<span class="hljs-type">void</span> *<span class="hljs-title function_">malloc</span><span class="hljs-params">(<span class="hljs-type">size_t</span> n)</span>;
<span class="hljs-type">void</span> *<span class="hljs-title function_">calloc</span><span class="hljs-params">(<span class="hljs-type">size_t</span> n, <span class="hljs-type">size_t</span> size)</span>;
<span class="hljs-type">void</span> <span class="hljs-title function_">free</span><span class="hljs-params">(<span class="hljs-type">void</span> *p)</span>;
</code></pre>
<ul>
<li data-marpit-fragment="1"><code>malloc(n)</code>
<ul>
<li data-marpit-fragment="2">힙 영역에 <code>n</code> 바이트 크기의 초기화되지 않은 메모리 블록을 할당</li>
<li data-marpit-fragment="3">성공 시 해당 블록의 시작 주소를, 실패 시 <code>NULL</code>을 반환</li>
</ul>
</li>
<li data-marpit-fragment="4"><code>calloc(n, size)</code>
<ul>
<li data-marpit-fragment="5">힙 영역에 <code>n</code> × <code>size</code> 바이트 크기의 0으로 초기화된 메모리 블록을 할당</li>
<li data-marpit-fragment="6">성공 시 해당 블록의 시작 주소를, 실패 시 <code>NULL</code>을 반환</li>
</ul>
</li>
<li data-marpit-fragment="7"><code>free(p)</code>
<ul>
<li data-marpit-fragment="8"><code>p</code>가 메모리 관리 함수 (<code>malloc</code>, <code>calloc</code>, <code>realloc</code>)에서 반환된 포인터일 경우, 이를 해제</li>
<li data-marpit-fragment="9">메모리 관리 함수가 반환한 주소가 아니거나 이미 해제된 주소를 전달할 경우 UB</li>
<li data-marpit-fragment="10"><code>free(p)</code> 이후 <code>p</code>는 더 이상 유효하지 않으며, 이를 사용하면 UB</li>
</ul>
</li>
<li data-marpit-fragment="11">메모리 관리 함수는 <code>void *</code>형을 반환하므로 형에 독립적이며, <strong>범용적으로 사용 가능</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">int</span> *ip = (<span class="hljs-type">int</span> *) <span class="hljs-built_in">malloc</span>(<span class="hljs-keyword">sizeof</span>(<span class="hljs-type">int</span>));
<span class="hljs-type">struct</span> tnode *node = (<span class="hljs-keyword">struct</span> tnode *) <span class="hljs-built_in">malloc</span>(<span class="hljs-keyword">sizeof</span>(<span class="hljs-keyword">struct</span> tnode));
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" lang="en-US">
<h2 id="self%E2%80%91referential-structures-contd---6">Self‑referential Structures (Cont'd - 6)</h2>
<h3 id="%EB%8F%99%EC%A0%81-%EC%A0%80%EC%9E%A5%EA%B3%B5%EA%B0%84-%ED%95%A0%EB%8B%B9%EA%B8%B0-%EC%98%88%EC%8B%9C">동적 저장공간 할당기 예시</h3>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdlib.h&gt;</span></span>

<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>
{
    <span class="hljs-type">int</span> *pa, *pb;
    <span class="hljs-type">int</span> n = <span class="hljs-number">5</span>;

    pa = (<span class="hljs-type">int</span> *) <span class="hljs-built_in">malloc</span>(n * <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">int</span>));
    <span class="hljs-keyword">if</span> (pa == <span class="hljs-literal">NULL</span>) {
        <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;malloc failed.\n&quot;</span>);
    } <span class="hljs-keyword">else</span> {
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; n; ++i) {
            pa[i] = i * <span class="hljs-number">10</span>;
            <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;pa[%d] = %d\n&quot;</span>, i, pa[i]);
        }
        <span class="hljs-built_in">free</span>(pa);
        pa = <span class="hljs-literal">NULL</span>; <span class="hljs-comment">/* Prevent use-after-free */</span>
    }

    pb = (<span class="hljs-type">int</span> *) <span class="hljs-built_in">calloc</span>(n, <span class="hljs-keyword">sizeof</span>(<span class="hljs-type">int</span>));
    <span class="hljs-keyword">if</span> (pb == <span class="hljs-literal">NULL</span>) {
        <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;calloc failed.\n&quot;</span>);
    } <span class="hljs-keyword">else</span> {
        <span class="hljs-keyword">for</span> (<span class="hljs-type">int</span> i = <span class="hljs-number">0</span>; i &lt; n; ++i)
            <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;pb[%d] = %d\n&quot;</span>, i, pb[i]);
        <span class="hljs-built_in">free</span>(pb);
        pb = <span class="hljs-literal">NULL</span>; <span class="hljs-comment">/* Prevent use-after-free */</span>
    }

    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-marpit-fragments="1" lang="en-US">
<h2 id="self%E2%80%91referential-structures-contd---7">Self‑referential Structures (Cont'd - 7)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">.
|-- getch.c   # NB: Reuse previously implemented file
|-- getword.c # NB: Reuse previously implemented file
|-- main.c
|-- strdup.c
|-- tree.c
`-- tree.h
</code></pre>
<ul>
<li data-marpit-fragment="1"><code>tree.h</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">ifndef</span> __WORD_TREE_H__</span>
<span class="hljs-meta">#<span class="hljs-keyword">define</span> __WORD_TREE_H__</span>

<span class="hljs-type">struct</span> tnode {           <span class="hljs-comment">/* the tree node: */</span>
    <span class="hljs-type">char</span> *word;          <span class="hljs-comment">/* points to the text */</span>
    <span class="hljs-type">int</span> count;           <span class="hljs-comment">/* number of occurrences */</span>
    <span class="hljs-type">struct</span> tnode *left;  <span class="hljs-comment">/* left child */</span>
    <span class="hljs-type">struct</span> tnode *right; <span class="hljs-comment">/* right child */</span>
};

<span class="hljs-keyword">struct</span> tnode *<span class="hljs-title function_">addtree</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> tnode *, <span class="hljs-type">char</span> *)</span>;
<span class="hljs-type">void</span> <span class="hljs-title function_">treeprint</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> tnode *)</span>;
<span class="hljs-keyword">struct</span> tnode *<span class="hljs-title function_">talloc</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>;

<span class="hljs-meta">#<span class="hljs-keyword">endif</span> <span class="hljs-comment">/* __WORD_TREE_H__ */</span></span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-marpit-fragments="1" lang="en-US">
<h2 id="self%E2%80%91referential-structures-contd---8">Self‑referential Structures (Cont'd - 8)</h2>
<ul>
<li data-marpit-fragment="1"><code>tree.c</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&quot;tree.h&quot;</span></span>

<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdlib.h&gt;</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;string.h&gt;</span></span>

<span class="hljs-type">char</span> *<span class="hljs-title function_">strdup</span><span class="hljs-params">(<span class="hljs-type">char</span> *)</span>;

<span class="hljs-comment">/* addtree: add a node with w, at or below p */</span>
<span class="hljs-keyword">struct</span> tnode *<span class="hljs-title function_">addtree</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> tnode *p, <span class="hljs-type">char</span> *w)</span>
{
    <span class="hljs-type">int</span> cond;

    <span class="hljs-keyword">if</span> (!p) {         <span class="hljs-comment">/* p == NULL, a new word has arrived */</span>
        p = <span class="hljs-built_in">talloc</span>(); <span class="hljs-comment">/* make a new node */</span>
        p-&gt;word = <span class="hljs-built_in">strdup</span>(w);
        p-&gt;count = <span class="hljs-number">1</span>;
        p-&gt;left = p-&gt;right = <span class="hljs-literal">NULL</span>;
    } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> ((cond = <span class="hljs-built_in">strcmp</span>(w, p-&gt;word)) == <span class="hljs-number">0</span>) { <span class="hljs-comment">/* repeated word */</span>
        p-&gt;count++;
    } <span class="hljs-keyword">else</span> <span class="hljs-keyword">if</span> (cond &lt; <span class="hljs-number">0</span>) { <span class="hljs-comment">/* less than into left subtree */</span>
        p-&gt;left = <span class="hljs-built_in">addtree</span>(p-&gt;left, w);
    } <span class="hljs-keyword">else</span> { <span class="hljs-comment">/* greater than into right subtree */</span>
        p-&gt;right = <span class="hljs-built_in">addtree</span>(p-&gt;right, w);
    }

    <span class="hljs-keyword">return</span> p;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" lang="en-US">
<h2 id="self%E2%80%91referential-structures-contd---9">Self‑referential Structures (Cont'd - 9)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">/* treeprint: in-order print of tree p */</span>
<span class="hljs-type">void</span> <span class="hljs-title function_">treeprint</span><span class="hljs-params">(<span class="hljs-keyword">struct</span> tnode *p)</span>
{
    <span class="hljs-keyword">if</span> (p) { <span class="hljs-comment">/* p != NULL */</span>
        <span class="hljs-built_in">treeprint</span>(p-&gt;left);
        <span class="hljs-built_in">printf</span>(<span class="hljs-string">&quot;%4d %s\n&quot;</span>, p-&gt;count, p-&gt;word);
        <span class="hljs-built_in">treeprint</span>(p-&gt;right);
    }
}

<span class="hljs-comment">/* talloc: make a tnode */</span>
<span class="hljs-keyword">struct</span> tnode *<span class="hljs-title function_">talloc</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>
{
    <span class="hljs-keyword">return</span> (<span class="hljs-keyword">struct</span> tnode *) <span class="hljs-built_in">malloc</span>(<span class="hljs-keyword">sizeof</span>(<span class="hljs-keyword">struct</span> tnode));
}
</code></pre>
<blockquote>
<p>If the tree becomes <strong>&quot;unbalanced&quot;</strong> because the words don't arrive in random order, the running time of the program can grow too much. As a worst case, if the words are already in order, this program does an expensive simulation of linear search. There are generalizations of the binary tree that do not suffer from this worst-case behavior, but we will not describe them here.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-marpit-fragments="1" lang="en-US">
<h2 id="self%E2%80%91referential-structures-contd---10">Self‑referential Structures (Cont'd - 10)</h2>
<ul>
<li data-marpit-fragment="1"><code>main.c</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;ctype.h&gt;</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdio.h&gt;</span></span>

<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&quot;tree.h&quot;</span></span>

<span class="hljs-meta">#<span class="hljs-keyword">define</span> MAXWORD 100</span>

<span class="hljs-type">int</span> <span class="hljs-title function_">getword</span><span class="hljs-params">(<span class="hljs-type">char</span> *, <span class="hljs-type">int</span>)</span>;

<span class="hljs-comment">/* word frequency count */</span>
<span class="hljs-type">int</span> <span class="hljs-title function_">main</span><span class="hljs-params">(<span class="hljs-type">void</span>)</span>
{
    <span class="hljs-type">struct</span> tnode *root;
    <span class="hljs-type">char</span> word[MAXWORD];

    root = <span class="hljs-literal">NULL</span>;
    <span class="hljs-keyword">while</span> (<span class="hljs-built_in">getword</span>(word, MAXWORD) != EOF) {
        <span class="hljs-keyword">if</span> (<span class="hljs-built_in">isalpha</span>(word[<span class="hljs-number">0</span>]))
            root = <span class="hljs-built_in">addtree</span>(root, word);
    }
    <span class="hljs-built_in">treeprint</span>(root);

    <span class="hljs-keyword">return</span> <span class="hljs-number">0</span>;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-marpit-fragments="1" lang="en-US">
<h2 id="self%E2%80%91referential-structures-contd---11">Self‑referential Structures (Cont'd - 11)</h2>
<ul>
<li data-marpit-fragment="1"><code>strdup.c</code></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;stdlib.h&gt;</span></span>
<span class="hljs-meta">#<span class="hljs-keyword">include</span> <span class="hljs-string">&lt;string.h&gt;</span></span>

<span class="hljs-type">char</span> *<span class="hljs-title function_">strdup</span><span class="hljs-params">(<span class="hljs-type">char</span> *s)</span>
{
    <span class="hljs-type">char</span> *p;

    <span class="hljs-comment">/* make a duplicate of s */</span>
    p = (<span class="hljs-type">char</span> *) <span class="hljs-built_in">malloc</span>(<span class="hljs-built_in">strlen</span>(s) + <span class="hljs-number">1</span>); <span class="hljs-comment">/* +1 for &#x27;\0&#x27; */</span>
    <span class="hljs-keyword">if</span> (p)                              <span class="hljs-comment">/* p != NULL */</span>
        <span class="hljs-built_in">strcpy</span>(p, s);

    <span class="hljs-keyword">return</span> p;
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-marpit-fragments="5" lang="en-US">
<h2 id="table-lookup">Table Lookup</h2>
<ul>
<li data-marpit-fragment="1">
<p>테이블 탐색은 여러 분야에서 사용되고 있음</p>
<ul>
<li data-marpit-fragment="2">데이터베이스, 컴파일러, 전처리기, etc.</li>
</ul>
</li>
<li data-marpit-fragment="3">
<p>간단한 매크로 처리기를 구현하여 테이블 탐색의 원리 학습:</p>
<ol>
<li>
<p><code>install(s, t)</code>: 식별자 <code>s</code>와 대치할 문자열 <code>t</code>을 매크로 처리기 내부 테이블에 등록</p>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-meta">#<span class="hljs-keyword">define</span> IN 1</span>
</code></pre>
</li>
<li>
<p><code>lookup(s)</code>: 식별자 <code>s</code>가 내부 테이블에 등록된 상태인지 탐색</p>
<ul>
<li data-marpit-fragment="4">식별자 <code>s</code>가 내부 테이블에 존재할 경우 등록된 레코드를 가리키는 포인터 반환</li>
<li data-marpit-fragment="5">식별자 <code>s</code>가 내부 테이블에 존재하지 않을 경우 <code>NULL</code> 반환</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c">state = IN; <span class="hljs-comment">/* `IN` must be replaced by 1 */</span>
</code></pre>
</li>
</ol>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-marpit-fragments="3" lang="en-US">
<h2 id="table-lookup-contd---1">Table Lookup (Cont'd - 1)</h2>
<h3 id="%EC%97%B0%EA%B2%B0-%EB%A6%AC%EC%8A%A4%ED%8A%B8-linked-list">연결 리스트 (Linked List)</h3>
<ul>
<li data-marpit-fragment="1">각 노드를 포인터를 사용해 연결된 <strong>논리적인 선형 구조</strong>를 갖는 자료 구조</li>
<li data-marpit-fragment="2">연결 리스트의 노드는 식별자와 대치 문자열의 정보, 다음 노드를 가리키는 포인터로 구성됨</li>
<li data-marpit-fragment="3">포인터의 값이 <code>NULL</code>일 경우, 연결 리스트의 끝 노드를 의미</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> nlist {          <span class="hljs-comment">/* table entry: */</span>
    <span class="hljs-type">struct</span> nlist *next; <span class="hljs-comment">/* next entry in chain */</span>
    <span class="hljs-type">char</span> *name;         <span class="hljs-comment">/* defined name */</span>
    <span class="hljs-type">char</span> *defn;         <span class="hljs-comment">/* replacement text */</span>
};
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="37" data-marpit-fragments="5" lang="en-US">
<h2 id="table-lookup-contd---2">Table Lookup (Cont'd - 2)</h2>
<h3 id="%ED%95%B4%EC%8B%9C-%ED%83%90%EC%83%89-hash-search">해시 탐색 (Hash Search)</h3>
<ul>
<li data-marpit-fragment="1">임의의 데이터를 <strong>음수가 아닌 정수형</strong> 값으로 변환하는 알고리즘</li>
<li data-marpit-fragment="2">매크로 처리기의 <code>install</code>, <code>lookup</code> 함수는 해시 탐색 알고리즘을 기반으로 구현</li>
<li data-marpit-fragment="3">입력되는 식별자를 <code>0 ~ HASHSIZE - 1</code> 범위의 정수로 변환하여 <strong>포인터 배열의 인덱스</strong>로 사용
<ul>
<li data-marpit-fragment="4">계산된 임의의 양의 정수를 <code>HASHSIZE</code>로 나머지 연산</li>
</ul>
</li>
<li data-marpit-fragment="5">포인터 배열의 각 요소는 <strong>연결 리스트 (a linked list)의 시작 노드를 가리킴</strong></li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">struct</span> nlist *hashtab[HASHSIZE]; <span class="hljs-comment">/* pointer table */</span>

<span class="hljs-comment">/* hash: form hash value for string s */</span>

<h2 id="table-lookup-contd---3">Table Lookup (Cont'd - 3)</h2>
<h3 id="%EB%A7%A4%ED%81%AC%EB%A1%9C-%EC%B2%98%EB%A6%AC%EA%B8%B0%EC%9D%98-%ED%83%90%EC%83%89-%EA%B3%BC%EC%A0%95">매크로 처리기의 탐색 과정</h3>
<ul>
<li data-marpit-fragment="1">해시 탐색 알고리즘의 특징 (데이터의 해시 값은 고유함)을 사용해 빠르게 탐색 가능</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">/* lookup: look for s in hashtab */</span>
<span class="hljs-keyword">struct</span> nlist *<span class="hljs-title function_">lookup</span><span class="hljs-params">(<span class="hljs-type">char</span> *s)</span>
{
    <span class="hljs-type">struct</span> nlist *np;

    <span class="hljs-keyword">for</span> (np = hashtab[<span class="hljs-built_in">hash</span>(s)]; np != <span class="hljs-literal">NULL</span>; np = np-&gt;next) {
        <span class="hljs-keyword">if</span> (!<span class="hljs-built_in">strcmp</span>(s, np-&gt;name))
            <span class="hljs-keyword">return</span> np; <span class="hljs-comment">/* found */</span>
    }

    <span class="hljs-keyword">return</span> <span class="hljs-literal">NULL</span>; <span class="hljs-comment">/* not found */</span>
}
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="39" data-marpit-fragments="2" lang="en-US">
<h2 id="table-lookup-contd---4">Table Lookup (Cont'd - 4)</h2>
<h3 id="%EB%A7%A4%ED%81%AC%EB%A1%9C-%EC%B2%98%EB%A6%AC%EA%B8%B0%EC%9D%98-%EB%93%B1%EB%A1%9D-%EA%B3%BC%EC%A0%95">매크로 처리기의 등록 과정</h3>
<ul>
<li data-marpit-fragment="1">등록 시 이미 존재하는 식별자에 대해서는 새로운 대치 문자열로 대치 (supersede)</li>
<li data-marpit-fragment="2">등록 시 내부 테이블에 존재하지 않을 경우 식별자를 새로 등록</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-comment">/* install: put (name, defn) in hashtab */</span>
<span class="hljs-keyword">struct</span> nlist *<span class="hljs-title function_">install</span><span class="hljs-params">(<span class="hljs-type">char</span> *name, <span class="hljs-type">char</span> *defn)</span>
{
    <span class="hljs-type">struct</span> nlist *np;
    <span class="hljs-type">unsigned</span> hashval;

    <span class="hljs-keyword">if</span> (!(np = <span class="hljs-built_in">lookup</span>(name))) {
        <span class="hljs-comment">/* not found */</span>
        np = (<span class="hljs-keyword">struct</span> nlist *) <span class="hljs-built_in">malloc</span>(<span class="hljs-keyword">sizeof</span>(*np));
        <span class="hljs-keyword">if</span> (!np || !(np-&gt;name = <span class="hljs-built_in">strdup</span>(name)))
            <span class="hljs-keyword">return</span> <span class="hljs-literal">NULL</span>;
        hashval = <span class="hljs-built_in">hash</span>(name);
        np-&gt;next = hashtab[hashval];
        hashtab[hashval] = np;
    } <span class="hljs-keyword">else</span> {
        <span class="hljs-comment">/* already there */</span>
        <span class="hljs-built_in">free</span>((<span class="hljs-type">void</span> *) np-&gt;defn); <span class="hljs-comment">/* free previous defn */</span>
    }
    <span class="hljs-keyword">if</span> (!(np-&gt;defn = <span class="hljs-built_in">strdup</span>(defn)))
        <span class="hljs-keyword">return</span> <span class="hljs-literal">NULL</span>; <span class="hljs-comment">/* if for nay reason there&#x27;s no room for a new entry */</span>

    <span class="hljs-keyword">return</span> np;
}
</code></pre>
</section>

<span class="hljs-comment">/*reverse: reverse string s in place*/</span>
<span class="hljs-type">void</span> <span class="hljs-title function_">reverse</span><span class="hljs-params">(<span class="hljs-type">char</span> s[])</span>
{
    <span class="hljs-type">int</span> c, i, j;

    <span class="hljs-keyword">for</span> (i = <span class="hljs-number">0</span>, j = (<span class="hljs-built_in">strlen</span>(s) - <span class="hljs-number">1</span>); i &lt; j; ++i, --j)
        c = s[i], s[i] = s[j], s[j] = c;
}

<span class="hljs-comment">/* itoa: convert n to characters in s */</span>
<span class="hljs-type">void</span> <span class="hljs-title function_">itoa</span><span class="hljs-params">(<span class="hljs-type">int</span> n, <span class="hljs-type">char</span> s[])</span>
{
    <span class="hljs-type">int</span> i, sign;

    <span class="hljs-comment">/* record sign   */</span>
    <span class="hljs-keyword">if</span> ((sign = n) &lt; <span class="hljs-number">0</span>)
        n = (-n); <span class="hljs-comment">/* make n positive */</span>
    i = <span class="hljs-number">0</span>;
    <span class="hljs-keyword">do</span> {
        s[i++] = (n % <span class="hljs-number">10</span>) + <span class="hljs-string">&#x27;0&#x27;</span>; <span class="hljs-comment">/* get next digit */</span>
    } <span class="hljs-keyword">while</span> ((n /= <span class="hljs-number">10</span>) &gt; <span class="hljs-number">0</span>); <span class="hljs-comment">/* delete it   */</span>
    <span class="hljs-keyword">if</span> (sign &lt; <span class="hljs-number">0</span>)
        s[i++] = <span class="hljs-string">&#x27;-&#x27;</span>;
    s[i] = <span class="hljs-string">&#x27;\0&#x27;</span>;
    <span class="hljs-built_in">reverse</span>(s);
}

<h2 id="typedef">Typedef</h2>
<ul>
<li data-marpit-fragment="1"><strong>이미 존재하는 형</strong>에 새로운 이름 생성
<ul>
<li data-marpit-fragment="2"><strong>새로운 형을 만드는 것이 아님에 유의</strong></li>
</ul>
</li>
<li data-marpit-fragment="3"><code>typedef</code> 키워드를 사용해 새로 선언한 이름은 형처럼 사용 가능</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-keyword">typedef</span> <span class="hljs-type">int</span> Length;   <span class="hljs-comment">/* Now `Length` is synonymous with `int` */</span>

Length len, maxlen;
Length *lengths[] = {<span class="hljs-number">1</span>, <span class="hljs-number">10</span>, <span class="hljs-number">100</span>};
</code></pre>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-keyword">typedef</span> <span class="hljs-type">char</span> *String  <span class="hljs-comment">/* Now `String` is synonymous with `char *` */</span>

String p, lineptr[MAXLINES];
<span class="hljs-type">int</span> <span class="hljs-title function_">strcmp</span><span class="hljs-params">(String, String)</span>;
p = (String) <span class="hljs-built_in">malloc</span>(<span class="hljs-number">100</span>);
</code></pre>
<ul>
<li data-marpit-fragment="4"><code>typedef</code>는 <code>extern</code>, <code>static</code> 같은 저장 클래스 지정자 (storage class specifiers)의 한 유형</li>
<li data-marpit-fragment="5">새로 정의할 이름은 <code>typedef</code> 바로 뒤가 아닌 변수 이름이 오는 자리에 위치</li>
</ul>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-keyword">extern</span> <span class="hljs-type">int</span> g_var = <span class="hljs-number">0</span>;  <span class="hljs-comment">/* `g_var` is in the usual variable name position */</span>
<span class="hljs-keyword">typedef</span> <span class="hljs-type">int</span> Length;    <span class="hljs-comment">/* `Length` appears in the same position as a variable */</span>
</code></pre>
<ul>
<li data-marpit-fragment="6"><code>typedef</code>로 새로 생성한 이름은 다른 이름과 구분하기 위해 <strong>대문자로 시작하는 이름 사용</strong></li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="47" lang="en-US">
<h2 id="typedef-contd">Typedef (Cont'd)</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-c"><span class="hljs-type">char</span> *<span class="hljs-title function_">alloc</span><span class="hljs-params">()</span>, str;

} p;

<span class="hljs-type">int</span> size = <span class="hljs-keyword">sizeof</span>(<span class="hljs-keyword">struct</span> point);

<span class="hljs-keyword">typedef</span> <span class="hljs-type">int</span> Length;
